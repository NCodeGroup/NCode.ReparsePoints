# Publish packages: when a GitHub release is published, packs every packable project with the version its tag names
# and pushes the packages, with their symbol packages, to nuget.org. docs/decisions/project-template/ says why.
#
# Two jobs, so the job that builds the code never holds a publishing credential:
#   - pack checks the tag is a version (v1.2.3 or v1.2.3-rc.1) and names a commit the default branch holds, so a tag on
#     an unreviewed commit publishes nothing; then it tests and packs in Release, and uploads the packages;
#   - publish runs in the protected `nuget` environment, exchanges the job's OIDC token for a short-lived nuget.org API
#     key through nuget.org trusted publishing, and pushes them. A rerun skips the packages already pushed.
#
# Set up once: on nuget.org, a trusted publishing policy for this repository and the workflow file publish.yml; in the
# repository, the `nuget` environment, with required reviewers, and the variable NUGET_USER naming the nuget.org account
# that owns the policy. The project owns this file: template updates never change it. A project that publishes from a
# workflow of its own deletes it.
name: Publish packages

on:
  release:
    types: [published]

permissions: {}

# One publication at a time; a second waits rather than racing the first to nuget.org.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read the version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "The release tag '$env:TAG' isn't a version such as v1.2.3." }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch's history, for the check below.
          fetch-depth: 0
          persist-credentials: false
      # Only reviewed code publishes: the tag must name a commit the default branch already holds.
      - name: Check the tagged commit is on the default branch
        shell: pwsh
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -eq 1) { throw "The release tag names a commit that isn't on $env:DEFAULT_BRANCH: tag a commit that is." }
          if ($LASTEXITCODE) { throw "git merge-base failed with exit code $LASTEXITCODE." }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test
        run: dotnet test --configuration Release
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack --configuration Release --output artifacts/packages "-p:Version=$VERSION"
      # A project that sets its own Version would pack a version the tag doesn't name.
      - name: Check every package has the tag's version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $packages = @(Get-ChildItem artifacts/packages -Filter '*.nupkg')
          if (-not $packages) { throw 'dotnet pack produced no package: set IsPackable to false only on the projects that are not published.' }
          $wrong = @($packages | Where-Object { -not $_.Name.EndsWith(".$env:VERSION.nupkg", [StringComparison]::OrdinalIgnoreCase) })
          if ($wrong) { throw "These packages don't have version $env:VERSION, the tag's: $($wrong.Name -join ', ')" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to nuget.org
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      # A version already on nuget.org can't be replaced: when every package has it, this release publishes nothing.
      # When only some do, a run that failed part way is being run again, and the push below completes it.
      - name: Check the version is new
        id: new
        shell: pwsh
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          $packages = @(Get-ChildItem packages -Filter '*.nupkg')
          $published = 0
          foreach ($package in $packages) {
            $id = $package.Name.Substring(0, $package.Name.Length - ".$env:VERSION.nupkg".Length).ToLowerInvariant()
            try { $versions = (Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/$id/index.json").versions } catch { $versions = @() }
            if ($versions -contains $env:VERSION.ToLowerInvariant()) { $published++ }
          }
          if ($published -eq $packages.Count) { throw "Every package is already on nuget.org at $env:VERSION; publish a new version." }
          "pushed=$($packages.Count - $published)" >> $env:GITHUB_OUTPUT
          "total=$($packages.Count)" >> $env:GITHUB_OUTPUT
      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # dotnet nuget push also pushes each package's .snupkg, found beside it, to the nuget.org symbol server.
      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.pack.outputs.version }}
          PUSHED: ${{ steps.new.outputs.pushed }}
          TOTAL: ${{ steps.new.outputs.total }}
        run: |
          dotnet nuget push 'packages/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "Published $PUSHED of $TOTAL packages at **$VERSION** to nuget.org; the others were already there." >> "$GITHUB_STEP_SUMMARY"
